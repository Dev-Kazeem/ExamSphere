<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
    .jt {
        --g: #0E6B45; --g2: #083D28; --mint: #E6F2EB; --ink: #14201A; --mute: #5A6A61;
        --line: #D3E0D8; --hi: #FFD84D; --red: #C23A2E; --ok: #157A4B;
        font-family: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink); font-size: 1.02rem; line-height: 1.5;
    }
    .jt h1, .jt h2, .jt h3, .jt h4, .jt .jt-display {
        font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', sans-serif;
        letter-spacing: -0.02em; color: var(--ink);
    }
    .jt h1 { font-size: clamp(1.7rem, 4.5vw, 2.5rem); font-weight: 800; line-height: 1.1; }
    .jt h2 { font-size: 1.35rem; font-weight: 700; }
    .jt a { color: var(--g); }
    .jt .text-muted, .jt .jt-mute { color: var(--mute) !important; }

    /* sub navigation */
    .jt-subnav { display: flex; gap: 0.25rem; overflow-x: auto; margin: -0.25rem 0 1.5rem; border-bottom: 2px solid var(--ink); scrollbar-width: none; }
    .jt-subnav::-webkit-scrollbar { display: none; }
    .jt-subnav a { padding: 0.6rem 0.9rem; white-space: nowrap; font-weight: 700; font-size: 0.95rem; color: var(--ink); text-decoration: none; }
    .jt-subnav a:hover { background: var(--mint); }
    .jt-subnav a.active { box-shadow: inset 0 -6px 0 var(--hi); }

    /* surfaces */
    .jt-box { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 1.1rem 1.25rem; }
    .jt-box.flat { border: 0; background: var(--mint); }
    .jt-rule { border: 0; border-top: 1px solid var(--line); margin: 1.25rem 0; }

    /* buttons */
    .jt-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.65rem 1.15rem; font-weight: 700; font-size: 1rem; border: 2px solid var(--ink); border-radius: 8px; background: #fff; color: var(--ink) !important; text-decoration: none; cursor: pointer; transition: transform .12s, box-shadow .12s; }
    .jt-btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
    .jt-btn.primary { background: var(--g); color: #fff !important; border-color: var(--g2); }
    .jt-btn.hi { background: var(--hi); }
    .jt-btn.sm { padding: 0.35rem 0.8rem; font-size: 0.9rem; }
    .jt-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    /* greeting + score ruler */
    .jt-hero { background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 22px 22px; background-color: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 1.25rem 1.4rem 1.1rem; margin-bottom: 1.25rem; }
    .jt-streak { display: inline-flex; align-items: center; gap: 0.4rem; background: var(--hi); border: 2px solid var(--ink); border-radius: 999px; padding: 0.2rem 0.75rem; font-weight: 700; font-size: 0.92rem; }
    .jt-ruler { position: relative; height: 22px; background: #fff; border: 2px solid var(--ink); border-radius: 4px; margin: 2.8rem 0 1.7rem; }
    .jt-ruler-fill { position: absolute; top: 0; bottom: 0; left: 0; background: var(--g); border-radius: 1px; transition: width .6s ease; }
    .jt-ruler-ticks { position: absolute; left: 0; right: 0; top: calc(100% + 3px); display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--mute); }
    .jt-flag { position: absolute; top: -34px; bottom: -8px; width: 0; border-left: 3px dashed var(--red); }
    .jt-flag span { position: absolute; top: 0; left: 0; transform: translate(-50%, -100%); background: var(--red); color: #fff; font-weight: 700; font-size: 0.78rem; padding: 0.1rem 0.5rem; border-radius: 4px; white-space: nowrap; }
    .jt-flag.flip span { transform: translate(-85%, -100%); }

    .jt-stat { border-left: 4px solid var(--g); padding: 0.15rem 0 0.15rem 0.8rem; }
    .jt-stat b { display: block; font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.9rem; line-height: 1.1; }
    .jt-stat small { color: var(--mute); }

    /* quick actions */
    .jt-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.85rem; }
    @media (min-width: 768px) { .jt-tiles { grid-template-columns: 1.4fr 1fr 1fr 1fr; } }
    .jt-tile { display: flex; flex-direction: column; justify-content: space-between; min-height: 118px; padding: 0.95rem 1rem; border: 2px solid var(--ink); border-radius: 10px; background: #fff; color: var(--ink) !important; text-decoration: none; transition: transform .12s, box-shadow .12s; }
    .jt-tile:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--ink); }
    .jt-tile i { font-size: 1.5rem; }
    .jt-tile b { font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.1rem; line-height: 1.2; }
    .jt-tile.main { background: var(--g); color: #fff !important; border-color: var(--g2); }
    .jt-tile .lock { font-size: 0.78rem; font-weight: 700; color: var(--red); }
    .jt-tile.main .lock { color: var(--hi); }

    .jt-chip { display: inline-block; border: 1.5px solid var(--ink); border-radius: 6px; padding: 0.1rem 0.55rem; font-size: 0.85rem; font-weight: 700; background: #fff; margin: 0 0.3rem 0.3rem 0; }
    .jt-chip.mine { background: var(--hi); }

    /* tables */
    .jt-table { width: 100%; border-collapse: collapse; }
    .jt-table th { text-align: left; font-size: 0.82rem; color: var(--mute); font-weight: 700; padding: 0.5rem 0.6rem; border-bottom: 2px solid var(--ink); }
    .jt-table td { padding: 0.65rem 0.6rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .jt-table tr.me td { background: #FFF6CC; font-weight: 700; }
    .jt-rank { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 1.2rem; }
    .jt-pass { color: var(--ok); font-weight: 700; } .jt-fail { color: var(--red); font-weight: 700; }

    /* subject list */
    .jt-subject { display: flex; align-items: center; gap: 0.9rem; padding: 0.85rem 0; border-bottom: 1px solid var(--line); color: var(--ink) !important; text-decoration: none; }
    .jt-subject:hover { background: var(--mint); }
    .jt-subject .ic { width: 2.6rem; height: 2.6rem; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: 8px; font-size: 1.25rem; flex: 0 0 auto; background: #fff; }
    .jt-subject.mine .ic { background: var(--hi); }
    .jt-subject .n { margin-left: auto; text-align: right; font-weight: 700; }
    .jt-subject button { all: unset; display: flex; align-items: center; gap: 0.9rem; width: 100%; cursor: pointer; padding: 0; }

    /* mock exam */
    .jt-bar { position: sticky; top: 0; z-index: 30; background: var(--ink); color: #fff; padding: 0.6rem 0.9rem; border-radius: 0 0 10px 10px; margin: -0.5rem 0 1.25rem; }
    .jt-bar .time { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
    .jt-bar .time.low { color: var(--hi); animation: jtblink 1s steps(2) infinite; }
    @keyframes jtblink { 50% { opacity: 0.35; } }
    .jt-dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 0.45rem; }
    .jt-dot { width: 1.7rem; height: 1.7rem; display: grid; place-items: center; font-size: 0.78rem; font-weight: 700; border: 1.5px solid #fff; border-radius: 4px; color: #fff !important; text-decoration: none; }
    .jt-dot.done { background: var(--hi); color: var(--ink) !important; border-color: var(--hi); }
    .jt-q { scroll-margin-top: 120px; margin-bottom: 1.1rem; }
    .jt-q .num { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 0.9rem; color: var(--g); }
    .jt-opt { position: relative; display: flex; align-items: flex-start; gap: 0.75rem; border: 1.5px solid var(--line); border-radius: 8px; padding: 0.65rem 0.85rem; margin: 0.45rem 0; cursor: pointer; background: #fff; }
    .jt-opt input { position: absolute; opacity: 0; pointer-events: none; }
    .jt-opt .L { flex: 0 0 1.8rem; height: 1.8rem; display: grid; place-items: center; border: 1.5px solid var(--ink); border-radius: 50%; font-weight: 700; font-size: 0.9rem; background: #fff; }
    .jt-opt:has(input:checked) { border-color: var(--g); background: var(--mint); }
    .jt-opt:has(input:checked) .L { background: var(--g); color: #fff; border-color: var(--g); }
    .jt-opt:focus-within { outline: 3px solid var(--hi); }
    .jt-opt.right { border-color: var(--ok); background: #E1F4E8; }
    .jt-opt.wrong { border-color: var(--red); background: #FBE7E4; }
    .jt-opt.right .L { background: var(--ok); color: #fff; border-color: var(--ok); }
    .jt-opt.wrong .L { background: var(--red); color: #fff; border-color: var(--red); }
    .jt-explain { border-left: 4px solid var(--hi); background: #FFFBE6; padding: 0.6rem 0.85rem; margin-top: 0.6rem; font-size: 0.95rem; }
    .jt-score { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(3rem, 12vw, 5rem); line-height: 1; }

    /* chat */
    .jt-chat { display: flex; flex-direction: column; height: calc(100dvh - 215px); min-height: 440px; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; background: #E3ECE6; }
    .jt-chat-head { background: var(--g); color: #fff; padding: 0.65rem 1rem; display: flex; align-items: center; gap: 0.75rem; }
    .jt-chat-head .av { width: 2.4rem; height: 2.4rem; border-radius: 50%; background: var(--hi); color: var(--ink); display: grid; place-items: center; font-size: 1.2rem; }
    .jt-thread { flex: 1; overflow-y: auto; padding: 0.9rem 0.8rem; display: flex; flex-direction: column; gap: 0.45rem; }
    .jt-bubble { max-width: 86%; padding: 0.5rem 0.75rem 0.3rem; border-radius: 10px; box-shadow: 0 1px 0 rgba(0,0,0,.12); white-space: pre-wrap; word-wrap: break-word; }
    .jt-bubble.them { align-self: flex-start; background: #fff; border-top-left-radius: 2px; }
    .jt-bubble.me { align-self: flex-end; background: #D2F2C2; border-top-right-radius: 2px; }
    .jt-bubble .meta { display: flex; justify-content: flex-end; gap: 0.35rem; font-size: 0.72rem; color: var(--mute); margin-top: 0.1rem; }
    .jt-bubble.err { background: #FBE7E4; }
    .jt-typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--mute); animation: jtbounce 1.1s infinite; }
    .jt-typing span:nth-child(2) { animation-delay: .15s; } .jt-typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes jtbounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }
    .jt-compose { display: flex; gap: 0.5rem; align-items: flex-end; padding: 0.55rem; background: #F4F7F5; border-top: 1px solid var(--line); }
    .jt-compose textarea { flex: 1; resize: none; max-height: 120px; border: 1.5px solid var(--line); border-radius: 18px; padding: 0.5rem 0.9rem; font: inherit; }
    .jt-compose textarea:focus { outline: 3px solid var(--hi); border-color: var(--ink); }
    .jt-send { width: 2.8rem; height: 2.8rem; border-radius: 50%; border: 0; background: var(--g); color: #fff; font-size: 1.2rem; flex: 0 0 auto; }
    .jt-send:disabled { opacity: .5; }

    /* admin review */
    .jt-draft { border: 1.5px solid var(--line); border-radius: 8px; padding: 0.9rem 1rem; margin-bottom: 0.9rem; background: #fff; }
    .jt-draft.flag { border-color: var(--red); background: #FFF8F7; }
    .jt-draft input[type=text], .jt-draft textarea, .jt-draft select, .jt-draft input[type=number] { width: 100%; border: 1px solid var(--line); border-radius: 4px; padding: 0.3rem 0.5rem; font: inherit; font-size: 0.95rem; background: #fff; }
    .jt-draft label { font-size: 0.78rem; font-weight: 700; color: var(--mute); margin: 0.4rem 0 0.1rem; display: block; }
    .jt-badge { display: inline-block; font-size: 0.78rem; font-weight: 700; padding: 0.05rem 0.5rem; border-radius: 4px; background: var(--hi); border: 1.5px solid var(--ink); }
    .jt-progress { height: 14px; border: 2px solid var(--ink); border-radius: 4px; background: #fff; overflow: hidden; }
    .jt-progress > div { height: 100%; width: 0; background: var(--g); transition: width .4s; }
</style>
