{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}

<div class="row justify-content-center space-top">
    <div class="col-md-6">
        <div class="card shadow-sm text-center bg-light">
            <div class="card-body p-4">
                <i class="bi bi-envelope-check display-4 text-primary mb-3"></i>
                <h3>Almost there!</h3>
                <p class="text-muted">
                    We've sent a verification link to <strong>{{ email }}</strong>.
                    Click the link to activate your account and log in.
                </p>
                <p class="small text-muted">
                    Didn't get it? Check your spam folder, or
                    <a href="{% url 'accounts:resend_verification' %}" style="text-decoration: none;">Resend</a>.
                </p>
                <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary mt-2">Back to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
