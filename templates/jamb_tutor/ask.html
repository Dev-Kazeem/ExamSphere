{% extends 'base.html' %}
{% block title %}Ai | chat Page{% endblock %}
{% block content %}
<div class="container mt-4" style="max-width:700px">
<h3>Ask AI Teacher 🤖</h3>
<form method="POST">{% csrf_token %}
<input name="question" class="form-control form-control-lg" placeholder="e.g What is photosynthesis?" required>
<button class="btn btn-success w-100 mt-2">Ask</button></form>
{% if answer %}<div class="card p-3 mt-3"><b>Q: {{ question }}</b><hr><p style="white-space:pre-line">{{ answer }}</p></div>{% endif %}
</div>
{% endblock %}
