{% extends 'base.html' %}
{% block content %}
<div class="container mt-4" style="max-width:700px">
<h3>JAMB Mock - 10 Questions</h3>
<form method="POST">{% csrf_token %}
{% for q in questions %}
<div class="card p-3 mb-3"><b>{{ forloop.counter }}. {{ q.question_text }}</b><br>
{% for opt, val in q.options %}{% endfor %}
<label><input type="radio" name="q_{{ q.id }}" value="A" required> A. {{ q.option_a }}</label><br>
<label><input type="radio" name="q_{{ q.id }}" value="B"> B. {{ q.option_b }}</label><br>
<label><input type="radio" name="q_{{ q.id }}" value="C"> C. {{ q.option_c }}</label><br>
<label><input type="radio" name="q_{{ q.id }}" value="D"> D. {{ q.option_d }}</label>
</div>
{% endfor %}
<button class="btn btn-success btn-lg w-100">Submit Mock</button>
</form></div>
{% endblock %}
