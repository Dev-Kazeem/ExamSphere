{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block title %}Sign Up as {{ role }}{% endblock %}
{% block content %}

<div class="container">
<div class="row justify-content-center space-top bottom-up">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div style="display: flex; justify-content: center; margin-top: 15px; margin-bottom: 15px;">
                    <img style="width: 250px; height: 180px;" src="{% static 'images/logo.png' %}" alt="examspherelogo">
                </div>                
                <h3 class="mb-3 text-center">Create your {{ role }} account</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-2">Sign Up</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Already have an account? <a class="anchor" href="{% url 'accounts:login' %}">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
</div>
{% endblock %}
