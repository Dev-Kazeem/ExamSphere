<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #f4f6f9; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #212529; }
        .box { text-align: center; padding: 2rem; max-width: 480px; }
        .code { font-size: 5rem; font-weight: 800; color: #dc3545; line-height: 1; }
        h1 { font-size: 1.5rem; margin: 0.75rem 0; }
        p { color: #6c757d; line-height: 1.5; }
        a { display: inline-block; margin-top: 1rem; background: #0d6efd; color: #fff; text-decoration: none;
            padding: 0.6rem 1.25rem; border-radius: 0.4rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">500</div>
        <h1>Something went wrong on our end</h1>
        <p>We've been notified and are looking into it. Please try again in a few minutes.</p>
        <a href="/">Go to home</a>
    </div>
</body>
</html>
